[package]
name = "quilla"
version = "0.14.0"
description = "Quilla (羽墨) v0.14.0 - A lightweight, high-performance Markdown editor rewritten in Rust (Kylin OS V10 SP1 glibc 2.31 & webkit2gtk-4.0 / Hygon C86 3350)"
authors = ["Quilla Team"]
edition = "2021"

[lib]
name = "quilla_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "1.5", features = [] }

[dependencies]
tauri = { version = "1.8", features = ["window-all", "dialog-all", "custom-protocol"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ropey = "1.6"
notify = "6.1"
rayon = "1.10"
ignore = "0.4"
tempfile = "3.14"
base64 = "0.22"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
