<!DOCTYPE html>
<html lang="zh-CN" class="show-code-line-numbers">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quilla (羽墨) v0.6 - 极简所见即所得 Markdown 编辑器与双链知识库</title>
  <link rel="stylesheet" href="./src/themes/base.css" />
  <link rel="stylesheet" href="./src/themes/window.css" />
  <link rel="stylesheet" id="base_user_css" />
</head>
<body class="typora-node native-window-custom pin-outline show-code-line-numbers">
  <!-- 1. 自定义标题栏 (支持拖拽、双击最大化与窗口控制) -->
  <header id="top-titlebar" data-tauri-drag-region>
    <div id="w-titlebar-left" data-tauri-drag-region>
      <button type="button" class="toolbar-icon btn" id="w-menu-btn" title="主菜单">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="4" y1="6" x2="20" y2="6"></line>
          <line x1="4" y1="12" x2="20" y2="12"></line>
          <line x1="4" y1="18" x2="20" y2="18"></line>
        </svg>
      </button>
      <span class="title-text" id="title-text" data-tauri-drag-region>未命名.md - Quilla</span>
    </div>
    <div id="w-traffic-lights">
      <button type="button" class="toolbar-icon btn" id="w-graph-btn" title="双链知识图谱 (Ctrl+G)">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="6" cy="6" r="3"></circle>
          <circle cx="18" cy="6" r="3"></circle>
          <circle cx="12" cy="18" r="3"></circle>
          <line x1="8.6" y1="7.5" x2="15.4" y2="7.5"></line>
          <line x1="7.5" y1="8.6" x2="10.5" y2="15.4"></line>
          <line x1="16.5" y1="8.6" x2="13.5" y2="15.4"></line>
        </svg>
      </button>
      <button type="button" class="toolbar-icon btn" id="w-history-btn" title="本地版本历史 / 时间机器 (Ctrl+Alt+H)">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path>
          <path d="M3 3v5h5"></path>
          <path d="M12 7v5l4 2"></path>
        </svg>
      </button>
      <button type="button" class="toolbar-icon btn" id="w-settings" title="偏好设置 (Ctrl+,)">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="3"></circle>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
        </svg>
      </button>
      <button type="button" class="toolbar-icon btn" id="w-pin" title="窗口置顶">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="12" y1="17" x2="12" y2="22"></line>
          <path d="M5 17h14v-1.76a2 2 0 0 0-1.11-1.79l-1.78-.9A2 2 0 0 1 15 10.76V6h1a2 2 0 0 0 0-4H8a2 2 0 0 0 0 4h1v4.76a2 2 0 0 1-1.11 1.79l-1.78.9A2 2 0 0 0 5 15.24Z"></path>
        </svg>
      </button>
      <button type="button" class="toolbar-icon btn" id="w-min" title="最小化">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="5" y1="12" x2="19" y2="12"></line></svg>
      </button>
      <button type="button" class="toolbar-icon btn" id="w-max" title="最大化">
        <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect></svg>
      </button>
      <button type="button" class="toolbar-icon btn" id="w-close" title="关闭">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
      </button>
    </div>
  </header>

  <div id="layout-container">
    <!-- 2. 侧边栏 (顶部标签条 + 内容视图 + 底部操作栏 + 边缘拖拽把手) -->
    <aside id="typora-sidebar">
      <!-- 2.1 顶部标签切换栏 (Files / Outline / Search) -->
      <div class="info-panel-tab-wrapper">
        <div class="info-panel-tab active" id="tab-files" title="文件库">
          <div class="info-panel-tab-title">文件</div>
          <div class="info-panel-tab-border"></div>
        </div>
        <div class="info-panel-tab" id="tab-outline" title="大纲目录 (支持多选、右键点选转换与拖拽重排)">
          <div class="info-panel-tab-title">大纲</div>
          <div class="info-panel-tab-border"></div>
        </div>
        <div class="info-panel-tab" id="tab-search" title="全文搜索与 #标签 聚合">
          <div class="info-panel-tab-title">搜索 · 标签</div>
          <div class="info-panel-tab-border"></div>
        </div>
      </div>

      <!-- 2.2 核心内容面板 -->
      <div class="sidebar-content" id="sidebar-content">
        <!-- 2.2.1 文件库面板 (树状目录 / 空状态卡片) -->
        <div id="panel-files" class="panel-view active">
          <!-- 未打开工作区时的空状态卡片 -->
          <div id="sidebar-empty-state" class="sidebar-empty-state">
            <div class="empty-state-icon">
              <svg width="42" height="42" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path>
              </svg>
            </div>
            <div class="empty-state-title">未打开文件夹</div>
            <div class="empty-state-desc">打开包含 Markdown 的工作区以启用文件库与 [[双链]] 知识库</div>
            <button type="button" id="open-folder-empty-btn" class="ty-btn-primary">打开文件夹...</button>
          </div>

          <!-- 已打开工作区时的顶部操作栏与文件树 -->
          <div id="sidebar-workspace-container" class="sidebar-workspace-container" style="display: none;">
            <div class="workspace-header-bar">
              <div class="workspace-folder-info" id="workspace-folder-trigger" title="点击更换工作区">
                <span class="workspace-folder-icon">
                  <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path></svg>
                </span>
                <span id="workspace-folder-name" class="workspace-folder-name">Workspace</span>
              </div>
              <div class="workspace-actions">
                <button type="button" id="sidebar-action-new-file" class="sidebar-icon-btn" title="新建文件">
                  <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                    <polyline points="14 2 14 8 20 8"></polyline>
                    <line x1="12" y1="18" x2="12" y2="12"></line>
                    <line x1="9" y1="15" x2="15" y2="15"></line>
                  </svg>
                </button>
                <button type="button" id="sidebar-action-new-folder" class="sidebar-icon-btn" title="新建文件夹">
                  <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path>
                    <line x1="12" y1="11" x2="12" y2="17"></line>
                    <line x1="9" y1="14" x2="15" y2="14"></line>
                  </svg>
                </button>
                <button type="button" id="sidebar-action-sort" class="sidebar-icon-btn" title="切换排序：按名称 / 按修改时间">
                  <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <line x1="4" y1="6" x2="13" y2="6"></line>
                    <line x1="4" y1="12" x2="11" y2="12"></line>
                    <line x1="4" y1="18" x2="11" y2="18"></line>
                    <polyline points="15 15 18 18 21 15"></polyline>
                    <line x1="18" y1="6" x2="18" y2="18"></line>
                  </svg>
                </button>
                <button type="button" id="sidebar-action-refresh" class="sidebar-icon-btn" title="刷新工作区">
                  <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <polyline points="23 4 23 10 17 10"></polyline>
                    <polyline points="1 20 1 14 7 14"></polyline>
                    <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path>
                  </svg>
                </button>
                <button type="button" id="sidebar-action-close" class="sidebar-icon-btn" title="关闭工作区">
                  <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <line x1="18" y1="6" x2="6" y2="18"></line>
                    <line x1="6" y1="6" x2="18" y2="18"></line>
                  </svg>
                </button>
              </div>
            </div>
            <div id="file-library-tree" class="file-library-tree"></div>
          </div>
        </div>

        <!-- 2.2.2 大纲视图 -->
        <div id="panel-outline" class="panel-view">
          <div class="outline-filter-bar">
            <input type="text" id="outline-search-input" class="outline-search-input" placeholder="筛选章节标题 (Ctrl+点击多选)..." autocomplete="off" spellcheck="false" />
            <button type="button" id="outline-toggle-all-btn" class="sidebar-icon-btn" title="全部展开 / 折叠子章节">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <polyline points="7 15 12 20 17 15"></polyline>
                <polyline points="7 9 12 4 17 9"></polyline>
              </svg>
            </button>
          </div>
          <div id="outline-content" class="outline-content"></div>
        </div>

        <!-- 2.2.3 全文搜索与标签面板 -->
        <div id="panel-search" class="panel-view">
          <div class="search-input-wrapper">
            <svg class="search-input-icon" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="11" cy="11" r="8"></circle>
              <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
            </svg>
            <input type="text" id="workspace-search-input" placeholder="搜索全文或输入 #标签..." autocomplete="off" spellcheck="false" />
            <button type="button" id="workspace-search-case-btn" class="search-case-toggle-btn" title="区分大小写">Aa</button>
          </div>
          <div id="workspace-tags-cloud" class="workspace-tags-cloud hidden"></div>
          <div id="workspace-search-meta" class="workspace-search-meta hidden"></div>
          <div id="workspace-search-results" class="workspace-search-results"></div>
        </div>
      </div>

      <!-- 2.3 侧边栏底部操作栏 -->
      <div id="ty-sidebar-footer" class="ty-sidebar-footer">
        <button type="button" id="sidebar-footer-new-file" class="sidebar-footer-btn" title="新建文件 (Ctrl+N)">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
          <span>新建文件</span>
        </button>
        <button type="button" id="sidebar-footer-open-folder" class="sidebar-footer-btn text-btn" title="打开或更换工作区文件夹">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path></svg>
          <span>打开文件夹...</span>
        </button>
      </div>
    </aside>

    <!-- 2.4 侧边栏边缘拖拽缩放把手 -->
    <div id="sidebar-resizer" class="sidebar-resizer"></div>

    <!-- 3. 主内容编辑区 (含顶部多文档标签栏 + 左右分屏对比编辑容器) -->
    <main id="content">
      <!-- 3.1 多文档标签栏 (Tabs Bar) -->
      <div id="doc-tabs-bar" class="doc-tabs-bar">
        <div id="doc-tabs-list" class="doc-tabs-list"></div>
        <div class="doc-tabs-actions">
          <button type="button" id="doc-tab-new-btn" class="doc-tab-action-btn" title="新建标签页 (Ctrl+N)">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
          </button>
          <button type="button" id="doc-tab-split-btn" class="doc-tab-action-btn" title="左右分屏对比编辑 (Ctrl+\)">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"></rect><line x1="12" y1="3" x2="12" y2="21"></line></svg>
          </button>
        </div>
      </div>

      <!-- 3.2 左右分屏编辑容器 -->
      <div id="editor-split-container" class="editor-split-container">
        <div id="write-wrapper" class="editor-split-pane primary-pane">
          <div id="write" class="write"></div>
        </div>

        <div id="split-resizer" class="split-resizer hidden" title="拖拽调节左右分屏宽度 (双击重置 50%)"></div>

        <div id="write-secondary-pane" class="editor-split-pane secondary-pane hidden">
          <div class="split-pane-header">
            <div class="split-pane-title-wrap">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"></rect><line x1="12" y1="3" x2="12" y2="21"></line></svg>
              <select id="split-doc-select" class="split-doc-select" title="选择右侧分屏对照文档"></select>
            </div>
            <div class="split-pane-actions">
              <button type="button" id="split-sync-scroll-btn" class="split-action-btn" title="开启/关闭左右分屏同步滚动">
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="7 8 3 12 7 16"></polyline><polyline points="17 8 21 12 17 16"></polyline><line x1="3" y1="12" x2="21" y2="12"></line></svg>
                <span>同步滚动</span>
              </button>
              <button type="button" id="split-close-btn" class="split-action-btn close-btn" title="关闭分屏视图 (Ctrl+\)">✕</button>
            </div>
          </div>
          <div id="write-secondary" class="write"></div>
        </div>
      </div>
    </main>
  </div>

  <!-- 4. 底部状态栏 -->
  <footer class="ty-footer">
    <div class="footer-left">
      <span id="footer-toggle-sidebar" class="footer-btn" title="切换侧边栏 (Ctrl+Shift+L)">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><line x1="9" y1="3" x2="9" y2="21"></line></svg>
        <span class="footer-btn-label">侧边栏</span>
      </span>
      <span id="footer-toggle-source" class="footer-btn" title="源码模式切换 (Ctrl+/)">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="16 18 22 12 16 6"></polyline><polyline points="8 6 2 12 8 18"></polyline></svg>
        <span class="footer-btn-label">源码模式</span>
      </span>
      <span id="footer-toggle-split" class="footer-btn" title="左右分屏对比编辑 (Ctrl+\)">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"></rect><line x1="12" y1="3" x2="12" y2="21"></line></svg>
        <span class="footer-btn-label">分屏</span>
      </span>
      <span id="footer-toggle-typewriter" class="footer-btn" title="打字机模式 (F9)">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="4" y1="12" x2="20" y2="12"></line><polyline points="8 8 12 4 16 8"></polyline><polyline points="16 16 12 20 8 16"></polyline></svg>
        <span class="footer-btn-label">打字机</span>
      </span>
      <span id="footer-toggle-focus" class="footer-btn" title="专注模式 (F8)">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><circle cx="12" cy="12" r="3"></circle></svg>
        <span class="footer-btn-label">专注</span>
      </span>
      <span id="footer-open-graph" class="footer-btn" title="双链知识图谱 (Ctrl+G)">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="6" cy="6" r="3"></circle><circle cx="18" cy="6" r="3"></circle><circle cx="12" cy="18" r="3"></circle><line x1="8.6" y1="7.5" x2="15.4" y2="7.5"></line><line x1="7.5" y1="8.6" x2="10.5" y2="15.4"></line><line x1="16.5" y1="8.6" x2="13.5" y2="15.4"></line></svg>
        <span class="footer-btn-label">图谱</span>
      </span>
      <span id="footer-open-history" class="footer-btn" title="本地版本历史 / 时间机器 (Ctrl+Alt+H)">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path><path d="M3 3v5h5"></path><path d="M12 7v5l4 2"></path></svg>
        <span class="footer-btn-label">历史</span>
      </span>
      <span id="footer-theme-selector" class="footer-btn" title="切换主题">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line></svg>
        <span class="footer-btn-label">主题</span>
      </span>
    </div>
    <div class="footer-right">
      <span id="footer-save-status" class="save-status" title="点击打开版本历史时间机器 (Ctrl+Alt+H)">已保存</span>
      <span id="footer-word-count" class="footer-stat-btn" title="点击查看字数与阅读时间详情">0 词</span>
      <span id="footer-char-count" class="footer-stat-btn" title="点击查看字数与阅读时间详情">0 字符</span>
    </div>
  </footer>

  <!-- 5. 独立全量打印挂载容器 (平时隐藏，打印/导出 PDF 时承载完整文档流，彻底规避虚拟滚动截断) -->
  <div id="quilla-print-mount" aria-hidden="true"></div>

  <script type="module" src="./src/main.ts"></script>
</body>
</html>
