<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quilla (羽墨) - 极简所见即所得 Markdown 编辑器</title>
  <link rel="stylesheet" href="./src/themes/base.css" />
  <link rel="stylesheet" href="./src/themes/window.css" />
  <link rel="stylesheet" id="base_user_css" />
</head>
<body class="typora-node native-window-custom pin-outline">
  <!-- 1. 自定义标题栏 (支持拖拽与窗口控制) -->
  <header id="top-titlebar" data-tauri-drag-region>
    <div id="w-titlebar-left" data-tauri-drag-region>
      <div id="w-menu-btn" title="菜单">
        <span class="ty-menu-btn-bar bar1"></span>
        <span class="ty-menu-btn-bar bar2"></span>
        <span class="ty-menu-btn-bar bar3"></span>
      </div>
      <span class="title-text" id="title-text" data-tauri-drag-region>Untitled.md - Quilla</span>
    </div>
    <div id="w-traffic-lights">
      <button class="toolbar-icon btn" id="w-pin" title="窗口置顶">📌</button>
      <button class="toolbar-icon btn" id="w-min" title="最小化">—</button>
      <button class="toolbar-icon btn" id="w-max" title="最大化">▢</button>
      <button class="toolbar-icon btn" id="w-close" title="关闭">✕</button>
    </div>
  </header>

  <div id="layout-container">
    <!-- 2. 侧边栏 (对齐 Typora 官方标准架构: 顶部标签条 + 内容视图 + 底部操作栏 + 边缘拖拽把手) -->
    <aside id="typora-sidebar">
      <!-- 2.1 顶部标签切换栏 (Typora 经典 Files / Outline / Search) -->
      <div class="info-panel-tab-wrapper">
        <div class="info-panel-tab active" id="tab-files" title="文件库">
          <div class="info-panel-tab-title">Files</div>
          <div class="info-panel-tab-border"></div>
        </div>
        <div class="info-panel-tab" id="tab-outline" title="大纲目录">
          <div class="info-panel-tab-title">Outline</div>
          <div class="info-panel-tab-border"></div>
        </div>
        <div class="info-panel-tab" id="tab-search" title="全文搜索">
          <div class="info-panel-tab-title">Search</div>
          <div class="info-panel-tab-border"></div>
        </div>
      </div>

      <!-- 2.2 核心内容面板 -->
      <div class="sidebar-content" id="sidebar-content">
        <!-- 2.2.1 文件库面板 (树状目录 / 空状态卡片) -->
        <div id="panel-files" class="panel-view active">
          <!-- 未打开工作区时的优雅空状态卡片 -->
          <div id="sidebar-empty-state" class="sidebar-empty-state">
            <div class="empty-state-icon">
              <svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path>
              </svg>
            </div>
            <div class="empty-state-title">未打开文件夹</div>
            <div class="empty-state-desc">打开包含 Markdown 的工作区以启用文件库</div>
            <button type="button" id="open-folder-empty-btn" class="ty-btn-primary">打开文件夹...</button>
          </div>

          <!-- 已打开工作区时的顶部操作栏与文件树 -->
          <div id="sidebar-workspace-container" class="sidebar-workspace-container" style="display: none;">
            <div class="workspace-header-bar">
              <div class="workspace-folder-info" id="workspace-folder-trigger" title="点击更换工作区">
                <span class="workspace-folder-icon">📁</span>
                <span id="workspace-folder-name" class="workspace-folder-name">Workspace</span>
              </div>
              <div class="workspace-actions">
                <button type="button" id="sidebar-action-new-file" class="sidebar-icon-btn" title="新建文件">
                  <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                    <polyline points="14 2 14 8 20 8"></polyline>
                    <line x1="12" y1="18" x2="12" y2="12"></line>
                    <line x1="9" y1="15" x2="15" y2="15"></line>
                  </svg>
                </button>
                <button type="button" id="sidebar-action-new-folder" class="sidebar-icon-btn" title="新建文件夹">
                  <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path>
                    <line x1="12" y1="11" x2="12" y2="17"></line>
                    <line x1="9" y1="14" x2="15" y2="14"></line>
                  </svg>
                </button>
                <button type="button" id="sidebar-action-refresh" class="sidebar-icon-btn" title="刷新工作区">
                  <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <polyline points="23 4 23 10 17 10"></polyline>
                    <polyline points="1 20 1 14 7 14"></polyline>
                    <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path>
                  </svg>
                </button>
                <button type="button" id="sidebar-action-close" class="sidebar-icon-btn" title="关闭工作区">
                  <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <line x1="18" y1="6" x2="6" y2="18"></line>
                    <line x1="6" y1="6" x2="18" y2="18"></line>
                  </svg>
                </button>
              </div>
            </div>
            <div id="file-library-tree" class="file-library-tree"></div>
          </div>
        </div>

        <!-- 2.2.2 大纲视图 -->
        <div id="panel-outline" class="panel-view">
          <div class="outline-filter-bar">
            <span class="outline-filter-title">大纲目录</span>
          </div>
          <div id="outline-content" class="outline-content"></div>
        </div>

        <!-- 2.2.3 全文搜索面板 -->
        <div id="panel-search" class="panel-view">
          <div class="search-input-wrapper">
            <svg class="search-input-icon" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="11" cy="11" r="8"></circle>
              <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
            </svg>
            <input type="text" id="workspace-search-input" placeholder="在工作区文件中搜索 (Enter)..." />
          </div>
          <div id="workspace-search-results" class="workspace-search-results"></div>
        </div>
      </div>

      <!-- 2.3 侧边栏底部操作栏 (Typora 风格) -->
      <div id="ty-sidebar-footer" class="ty-sidebar-footer">
        <button type="button" id="sidebar-footer-new-file" class="sidebar-footer-btn" title="新建文件 (Ctrl+N)">
          <span>+</span> 新建文件
        </button>
        <button type="button" id="sidebar-footer-open-folder" class="sidebar-footer-btn text-btn" title="打开或更换工作区文件夹">
          <span>📂</span> 打开...
        </button>
      </div>
    </aside>

    <!-- 2.4 侧边栏边缘拖拽缩放把手 -->
    <div id="sidebar-resizer" class="sidebar-resizer"></div>

    <!-- 3. 主内容编辑区 -->
    <main id="content">
      <div id="write-wrapper">
        <div id="write" class="write"></div>
      </div>
    </main>
  </div>

  <!-- 4. 底部状态栏 -->
  <footer class="ty-footer">
    <div class="footer-left">
      <span id="footer-toggle-sidebar" class="footer-btn" title="切换侧边栏 (Ctrl+Shift+L)">▤ 侧边栏</span>
      <span id="footer-toggle-source" class="footer-btn" title="源码模式切换 (Ctrl+/)">&lt;/&gt; 源码模式</span>
      <span id="footer-toggle-typewriter" class="footer-btn" title="打字机模式 (F9)">🖮 打字机</span>
      <span id="footer-toggle-focus" class="footer-btn" title="专注模式 (F8)">🎯 专注</span>
      <span id="footer-theme-selector" class="footer-btn" title="切换主题">🎨 主题</span>
    </div>
    <div class="footer-right">
      <span id="footer-save-status" class="save-status">已保存</span>
      <span id="footer-word-count">0 词</span>
      <span id="footer-char-count">0 字符</span>
    </div>
  </footer>

  <script type="module" src="./src/main.ts"></script>
</body>
</html>
