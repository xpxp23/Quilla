# Quilla (羽墨) v0.15.0 Cargo 跨架构通用构建配置
# 兼容银河麒麟高级服务器操作系统 V11 2503 (glibc 2.38 / GCC 12.3.1 / x86_64·AArch64·LoongArch64 / KVM·QEMU)
# 与银河麒麟桌面 V10 SP1 (海光 C86 3350)。
# 移除全局强制 AVX2/FMA，避免 KVM/QEMU 默认虚拟 CPU 触发 SIGILL 崩溃。

[target.x86_64-unknown-linux-gnu]
rustflags = [
  "-C", "link-arg=-Wl,-rpath,$ORIGIN/lib:/opt/quilla/lib"
]

[target.aarch64-unknown-linux-gnu]
rustflags = [
  "-C", "link-arg=-Wl,-rpath,$ORIGIN/lib:/opt/quilla/lib"
]

[target.loongarch64-unknown-linux-gnu]
rustflags = [
  "-C", "link-arg=-Wl,-rpath,$ORIGIN/lib:/opt/quilla/lib"
]

[env]
CARGO_TERM_COLOR = "always"
