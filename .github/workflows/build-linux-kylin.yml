name: Build Quilla Linux (Kylin OS V10 SP1 glibc 2.31 + webkit2gtk-4.0 & Hygon C86 3350)

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-kylin-v10-sp1-hygon3350:
    name: Build Kylin V10 SP1 (glibc 2.31 + webkit2gtk-4.0 + Hygon 3350)
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22 & pnpm
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        run: npm install -g pnpm@9

      - name: Build Frontend Assets & Run Architecture Regression Suite
        run: |
          pnpm install --no-frozen-lockfile
          node scripts/run-tests.mjs
          pnpm build

      - name: Compile Rust (Tauri v1.8) & Package inside Ubuntu 20.04 (glibc 2.31 + webkit2gtk-4.0) Container
        run: |
          chmod +x scripts/*.sh
          docker run --rm \
            -v "${GITHUB_WORKSPACE}:/work" \
            -w /work \
            ubuntu:20.04 \
            bash scripts/build-kylin-focal-container.sh

      - name: Print Kylin V10 SP1 ABI Verification Report
        run: |
          cat dist-kylin/ABI-VERIFICATION-REPORT.txt

      - name: Upload Kylin OS V10 SP1 (Hygon 3350) Release Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Quilla-v0.15.0-Kylin-V10-SP1-Hygon3350-Linux-x86_64
          path: |
            dist-kylin/*.deb
            dist-kylin/*.tar.gz
            dist-kylin/ABI-VERIFICATION-REPORT.txt
          if-no-files-found: error

      - name: Publish Release Assets to GitHub Release v0.15.0
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="${GITHUB_REF_NAME:-v0.15.0}"
          if [[ "$TAG_NAME" != v* ]]; then TAG_NAME="v0.15.0"; fi
          gh release upload "$TAG_NAME" \
            dist-kylin/*.deb \
            dist-kylin/*.tar.gz \
            dist-kylin/ABI-VERIFICATION-REPORT.txt \
            --clobber || true
