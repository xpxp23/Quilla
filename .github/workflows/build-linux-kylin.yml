name: Build Quilla Linux (Kylin OS V10 & Hygon C86 3350)

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-kylin-hygon3350:
    name: Build Kylin V10 (Hygon 3350 x86_64) DEB & Portable
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22 & pnpm
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Install Linux GTK3 & WebKitGTK System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            pkg-config \
            libssl-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libsoup-3.0-dev \
            libayatana-appindicator3-dev \
            xdg-utils \
            desktop-file-utils \
            shared-mime-info

      - name: Setup Rust Stable Toolchain (x86_64-unknown-linux-gnu)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Build Quilla & Package for Kylin OS (Hygon 3350)
        run: |
          chmod +x scripts/*.sh
          bash scripts/build-kylin-linux.sh

      - name: Upload Kylin OS (Hygon 3350) Release Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Quilla-v0.13.0-Kylin-Hygon3350-Linux-x86_64
          path: |
            dist-kylin/*.deb
            dist-kylin/*.tar.gz
          if-no-files-found: error
